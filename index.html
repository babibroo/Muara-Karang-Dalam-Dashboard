<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KCP Jakarta Muara Karang | Skor cabang dan rencana 3 bulan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style id="app-css">:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#EDF1F7; --ink:#0F1E36; --ink-2:#44546D; --ink-3:#6F7E95;
  --line:#DAE1EB; --line-2:#C5CFDD;
  --navy:#003D79; --navy-ink:#003D79; --navy-soft:#E3ECF7;
  --gold:#F5B31B; --gold-ink:#8A5A00; --gold-soft:#FFF3D6;
  --red:#C63D4A; --red-soft:#FBE8EA; --green:#1E8A67; --green-soft:#E1F3EC;
  --track:#E4E9F0; --muted:#AEB9C9;
  --hero-bg:#003D79; --hero-ink:#FFFFFF; --hero-ink-2:#C4D6EE; --hero-line:rgba(255,255,255,.22);
  --c-dpk:#003D79; --c-kredit:#3A86D6; --c-livin:#139C98; --c-kopra:#7A8BA8; --c-acq:#8B6CC0; --c-gmm:#C77A2B; --c-eko:#9AA6B8; --c-ter:#9AA6B8;
  --radius-panel:14px; --radius-card:8px;
  --font:"Archivo", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1322; --surface:#101C30; --surface-2:#16253D; --ink:#E6ECF5; --ink-2:#A8B5C8; --ink-3:#7F8CA2;
    --line:#22334D; --line-2:#2F4262;
    --navy:#4F93E3; --navy-ink:#8DBBF2; --navy-soft:#16294A;
    --gold:#F5B31B; --gold-ink:#F6C552; --gold-soft:#3A2E12;
    --red:#EE6F7A; --red-soft:#3A1920; --green:#4CC39A; --green-soft:#113428;
    --track:#1D2C45; --muted:#50627F;
    --hero-bg:#0D2D5C; --hero-ink:#FFFFFF; --hero-ink-2:#A9C2E6; --hero-line:rgba(255,255,255,.18);
    --c-dpk:#5B9CEA; --c-kredit:#86B8F0; --c-livin:#35C2BD;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#0A1322; --surface:#101C30; --surface-2:#16253D; --ink:#E6ECF5; --ink-2:#A8B5C8; --ink-3:#7F8CA2;
    --line:#22334D; --line-2:#2F4262;
    --navy:#4F93E3; --navy-ink:#8DBBF2; --navy-soft:#16294A;
    --gold:#F5B31B; --gold-ink:#F6C552; --gold-soft:#3A2E12;
    --red:#EE6F7A; --red-soft:#3A1920; --green:#4CC39A; --green-soft:#113428;
    --track:#1D2C45; --muted:#50627F;
    --hero-bg:#0D2D5C; --hero-ink:#FFFFFF; --hero-ink-2:#A9C2E6; --hero-line:rgba(255,255,255,.18);
    --c-dpk:#5B9CEA; --c-kredit:#86B8F0; --c-livin:#35C2BD;
    color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px;}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em;}
h2{font-size:17px;}
p{margin:0;}
.wrap{max-width:1440px;margin:0 auto;padding:0 20px 48px;}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0 14px;flex-wrap:wrap;}
.brandline{display:flex;align-items:baseline;gap:10px;min-width:0;}
.brandline b{font-weight:750;font-stretch:112%;color:var(--navy-ink);font-size:15px;}
.brandline span{color:var(--ink-3);font-size:14px;}
.savebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.savestate{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:6px;}
.savestate i{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;}
.savestate.dirty i{background:var(--gold);}
.savestate.ro i{background:var(--muted);}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:14px;font-weight:550;line-height:1.2;}
.btn:hover{border-color:var(--navy);}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
:root[data-theme="dark"] .btn.primary{color:#07172E;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#07172E;}}
.btn.primary:hover{filter:brightness(1.08);}
.btn[disabled]{opacity:.45;cursor:not-allowed;}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2);}
.btn.ghost:hover{border-color:var(--line-2);}
.btn.small{padding:4px 9px;font-size:13px;}
.btn.danger{color:var(--red);}

/* Z row 1 */
.row1{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:16px;align-items:stretch;}
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:var(--radius-panel);padding:26px 28px 24px;display:flex;flex-direction:column;gap:18px;min-width:0;}
.hero h1{font-size:clamp(22px,2.4vw,30px);font-weight:700;font-stretch:108%;line-height:1.15;}
.hero .sub{color:var(--hero-ink-2);font-size:15px;margin-top:4px;}
.scoreline{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:end;}
.bignum{display:flex;align-items:baseline;gap:6px;line-height:.82;}
.bignum .n{font-size:clamp(76px,9.5vw,128px);font-weight:800;font-stretch:125%;letter-spacing:-.03em;}
.bignum .of{font-size:22px;font-weight:500;color:var(--hero-ink-2);font-stretch:100%;}
.bignum-cap{font-size:13px;color:var(--hero-ink-2);margin-top:10px;}
.ruler{position:relative;padding:62px 0 42px;}
.ruler .track{position:relative;height:14px;border-radius:3px;background:rgba(255,255,255,.12);overflow:visible;}
.ruler .fill{position:absolute;left:0;top:0;bottom:0;background:#FFFFFF;border-radius:3px 0 0 3px;}
.ruler .gain{position:absolute;top:0;bottom:0;background:var(--gold);}
.ruler .ticks{position:absolute;left:0;right:0;top:100%;height:8px;background-image:repeating-linear-gradient(90deg,var(--hero-line) 0 1px,transparent 1px 5%);background-size:calc(100% + 1px) 100%;}
.ruler .tlabels{position:absolute;left:0;right:0;top:calc(100% + 10px);font-size:11px;color:var(--hero-ink-2);}
.ruler .tlabels span{position:absolute;transform:translateX(-50%);}
.ruler .mk{position:absolute;bottom:calc(100% + 6px);transform:translateX(-50%);font-size:12px;font-weight:650;white-space:nowrap;padding:2px 7px;border-radius:999px;}
.ruler .mk.now{background:#fff;color:#003D79;}
.ruler .mk.proj{background:var(--gold);color:#3B2800;bottom:calc(100% + 34px);}
.ruler .mk.proj::after{content:'';position:absolute;right:0;top:100%;width:2px;height:30px;background:var(--gold);}
.ruler .mk.now::after{content:'';position:absolute;right:0;top:100%;width:2px;height:6px;background:#fff;}
.ruler .ceil{position:absolute;top:-6px;bottom:-6px;border-left:2px dashed rgba(255,255,255,.7);}
.ruler .ceil-l{position:absolute;top:calc(100% + 26px);transform:translateX(-100%);font-size:11px;color:var(--hero-ink-2);white-space:nowrap;}
.hero .summary{font-size:15px;color:var(--hero-ink);max-width:70ch;}
.findings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;border-top:1px solid var(--hero-line);padding-top:16px;}
.findings p{font-size:13.5px;color:var(--hero-ink-2);line-height:1.45;}
.findings p b{display:block;color:var(--hero-ink);font-weight:650;font-size:13.5px;margin-bottom:2px;}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-panel);padding:20px 22px;min-width:0;}
.panel-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
.panel-h .hint{font-size:13px;color:var(--ink-3);margin-top:2px;}

/* filters */
.filters{display:flex;flex-direction:column;gap:14px;}
.fgroup{display:flex;flex-direction:column;gap:7px;}
.flabel{font-size:13px;color:var(--ink-2);font-weight:600;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:550;display:inline-flex;align-items:center;gap:6px;}
.chip:hover{border-color:var(--navy);}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff;}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#07172E;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#07172E;}}
.chip .dot{width:8px;height:8px;border-radius:50%;}
.chip .cnt{font-size:11.5px;opacity:.75;}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;flex-wrap:wrap;background:var(--surface);}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:13px;font-weight:550;color:var(--ink-2);border-right:1px solid var(--line);}
.seg button:last-child{border-right:0;}
.seg button[aria-pressed="true"]{background:var(--navy-soft);color:var(--navy-ink);font-weight:700;}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:9px;padding:0 10px;background:var(--surface);}
.search input{border:0;outline:0;background:transparent;padding:8px 0;width:100%;font-size:14px;}
.search:focus-within{outline:3px solid var(--gold);outline-offset:1px;}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2);cursor:pointer;}
.toggle input{width:16px;height:16px;accent-color:var(--navy);}
.activefilters{font-size:12.5px;color:var(--ink-3);}
.focuschip{display:inline-flex;align-items:center;gap:6px;background:var(--gold-soft);color:var(--gold-ink);border-radius:999px;padding:3px 4px 3px 10px;font-size:12.5px;font-weight:600;}
.focuschip button{border:0;background:transparent;color:inherit;padding:0 6px;font-size:14px;line-height:1;}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:16px 0;}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0;}
.kpi .k{font-size:13px;color:var(--ink-2);font-weight:600;}
.kpi .v{font-size:32px;font-weight:780;font-stretch:118%;letter-spacing:-.02em;line-height:1.1;color:var(--ink);}
.kpi .v small{font-size:15px;font-weight:500;color:var(--ink-3);font-stretch:100%;letter-spacing:0;margin-left:2px;}
.kpi .d{font-size:12.5px;color:var(--ink-3);}
.kpi .pos{color:var(--green);font-weight:650;}
.kpi .neg{color:var(--red);font-weight:650;}
.kpi.accent{border-color:var(--gold);box-shadow:inset 0 3px 0 var(--gold);}
.kpi .bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:4px;}
.kpi .bar i{display:block;height:100%;background:var(--green);}

/* rows */
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start;}
.row3,.planrow{margin-bottom:16px;}
.row4{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;margin-bottom:16px;align-items:start;}
.seg.wide{display:flex;flex-wrap:wrap;margin-bottom:12px;}
table.ptable{width:100%;border-collapse:collapse;font-size:13px;}
table.ptable th{text-align:right;font-weight:650;color:var(--ink-2);font-size:12px;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.ptable th:first-child,table.ptable td:first-child{text-align:left;}
table.ptable td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}
table.ptable tr.head td{font-weight:700;background:var(--surface-2);}
table.ptable td.pos{color:var(--green);}
table.ptable td.neg{color:var(--red);}
table.ptable td b{font-weight:650;}
.pathgrid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:start;}
.pathgrid .sectitle{margin-top:0;}

/* category bullets */
.cats{display:flex;flex-direction:column;gap:4px;}
.catrow{display:grid;grid-template-columns:148px minmax(0,1fr) 98px;align-items:center;gap:12px;padding:8px 8px;border-radius:8px;border:1px solid transparent;background:transparent;text-align:left;width:100%;}
.catrow:hover{background:var(--surface-2);}
.catrow[aria-pressed="true"]{border-color:var(--navy);background:var(--navy-soft);}
.catrow.dim{opacity:.55;}
.catname b{display:block;font-weight:650;font-size:14.5px;}
.catname span{display:block;font-size:12px;color:var(--ink-3);line-height:1.3;}
.cbar{position:relative;height:22px;}
.cbar .trk{position:absolute;left:0;top:3px;bottom:3px;background:var(--track);border-radius:3px;}
.cbar .lost{position:absolute;top:3px;bottom:3px;background:repeating-linear-gradient(135deg,var(--red-soft) 0 5px,color-mix(in srgb,var(--red) 30%,transparent) 5px 7px);border-radius:0 3px 3px 0;}
.cbar .val{position:absolute;left:0;top:3px;bottom:3px;background:var(--navy);border-radius:3px 0 0 3px;}
.cbar .pm{position:absolute;top:0;bottom:0;width:3px;background:var(--gold);border-radius:2px;}
.catscore{text-align:right;font-weight:700;font-size:15px;}
.catscore span{font-weight:500;color:var(--ink-3);font-size:13px;}
.catscore em{display:block;font-style:normal;font-size:11.5px;font-weight:600;}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-3);margin-top:12px;}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block;}
.sw.val{background:var(--navy);}
.sw.lost{background:repeating-linear-gradient(135deg,var(--red-soft) 0 3px,color-mix(in srgb,var(--red) 35%,transparent) 3px 5px);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);}
.sw.pm{width:3px;height:12px;background:var(--gold);}
.sw.trk{background:var(--track);}

/* gaps */
.gaps{display:flex;flex-direction:column;}
.gsub{font-size:13px;font-weight:650;color:var(--ink-2);margin:4px 0 6px;}
.gsub.more{margin-top:14px;}
.grow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 118px;gap:12px;align-items:center;padding:7px 8px;border-radius:8px;border:1px solid transparent;background:transparent;text-align:left;width:100%;}
.grow:hover{background:var(--surface-2);}
.grow[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);}
.gname{min-width:0;}
.gname b{font-weight:600;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gname span{font-size:12px;color:var(--ink-3);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.gbar{display:flex;align-items:center;gap:8px;min-width:0;}
.gbar .b{height:12px;border-radius:2px;background:var(--red);}
.gbar .b.capped{background:var(--muted);}
.gbar .b.risk{background:transparent;border:2px solid var(--gold);height:12px;}
.gbar small{font-size:12.5px;font-weight:700;white-space:nowrap;}
.gach{text-align:right;font-size:13px;font-weight:650;}
.gach span{display:block;font-size:11.5px;color:var(--ink-3);font-weight:500;white-space:nowrap;}
.gmore{margin-top:8px;align-self:flex-start;}
.empty{font-size:13.5px;color:var(--ink-3);padding:10px 8px;}

/* plan */
.fa-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.months{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
.months.single{grid-template-columns:minmax(0,1fr);}
.mcol{background:var(--surface-2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0;}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.mhead b{font-size:15px;font-weight:700;}
.mhead span{font-size:12px;color:var(--ink-3);display:block;}
.mproj{text-align:right;font-size:12px;color:var(--ink-3);}
.mproj b{display:block;font-size:20px;font-weight:780;font-stretch:115%;color:var(--gold-ink);}
.acard{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:var(--radius-card);padding:10px 12px;display:flex;flex-direction:column;gap:6px;}
.acard.prog{border-left-color:var(--gold);}
.acard.done{border-left-color:var(--green);}
.acard.done .at{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-2);}
.at{font-weight:650;font-size:14px;line-height:1.35;}
.ad{font-size:12.5px;color:var(--ink-2);line-height:1.45;}
.ameta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);}
.tag{background:var(--navy-soft);color:var(--navy-ink);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;white-space:nowrap;}
.tag.fa{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);}
.afoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 8px;margin-top:2px;}
.afoot .own{font-size:12px;color:var(--ink-3);min-width:0;}
.afoot .ctl{display:flex;gap:6px;align-items:center;margin-left:auto;}
.afoot select{border:1px solid var(--line-2);border-radius:6px;background:var(--surface);padding:3px 6px;font-size:12.5px;}
.addbtn{border:1px dashed var(--line-2);background:transparent;border-radius:var(--radius-card);padding:8px;font-size:13px;color:var(--ink-2);font-weight:600;}
.addbtn:hover{border-color:var(--navy);color:var(--navy-ink);}

/* path */
.path svg{display:block;width:100%;height:auto;overflow:visible;}
.path .axis text{font-size:11px;fill:var(--ink-3);}
.path .grid line{stroke:var(--line);}
.gainbar{display:flex;height:16px;border-radius:3px;overflow:hidden;background:var(--track);margin:6px 0 8px;}
.gainbar i{display:block;height:100%;}
.gainleg{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2);}
.gainleg span{display:inline-flex;align-items:center;gap:6px;}
.gainleg b{font-weight:700;}
.ctable{width:100%;border-collapse:collapse;font-size:13px;margin-top:14px;}
.ctable th{font-weight:600;color:var(--ink-3);text-align:right;padding:5px 6px;border-bottom:1px solid var(--line);font-size:12px;}
.ctable th:first-child,.ctable td:first-child{text-align:left;}
.ctable td{padding:5px 6px;text-align:right;border-bottom:1px solid var(--line);}
.ctable td.up{color:var(--green);font-weight:700;}
.ctable tr.total td{font-weight:750;border-bottom:0;}
.ctable td .d{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;}
.ctable .sel{background:var(--gold-soft);}
.sectitle{font-size:13.5px;font-weight:650;color:var(--ink-2);margin-top:16px;}

/* data table */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;}
table.data{width:100%;border-collapse:collapse;font-size:13px;min-width:1180px;}
table.data th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:650;color:var(--ink-2);padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12.5px;}
table.data th button{border:0;background:transparent;padding:0;font-weight:650;color:inherit;font-size:12.5px;}
table.data th.r,table.data td.r{text-align:right;}
table.data td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.data tr.grp td{background:var(--surface-2);font-weight:700;font-size:13px;color:var(--navy-ink);padding:7px 8px;}
table.data tr.hl td{background:var(--gold-soft);}
table.data tr.info td{color:var(--ink-3);}
.mname{min-width:170px;}
.mname b{font-weight:600;}
.mname span{display:block;font-size:11.5px;color:var(--ink-3);}
.num{display:inline-flex;align-items:center;gap:4px;justify-content:flex-end;}
.num input{width:88px;text-align:right;border:1px solid var(--line);border-radius:6px;padding:4px 6px;background:var(--surface);font-variant-numeric:tabular-nums;font-size:13px;}
.num input:hover{border-color:var(--line-2);}
.num input:focus{border-color:var(--navy);outline:none;box-shadow:0 0 0 2px var(--gold);}
.num input.plan{background:var(--gold-soft);border-color:transparent;}
.num input.w{width:58px;}
.num em{font-style:normal;font-size:11px;color:var(--ink-3);min-width:18px;text-align:left;}
.achcell{display:flex;align-items:center;gap:8px;justify-content:flex-end;}
.achbar{width:64px;height:8px;background:var(--track);border-radius:2px;position:relative;overflow:hidden;}
.achbar i{position:absolute;left:0;top:0;bottom:0;background:var(--navy);}
.achbar i.below{background:var(--red);}
.achbar b{position:absolute;top:-2px;bottom:-2px;width:1px;background:var(--ink-2);}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:650;white-space:nowrap;}
.pill.below{background:var(--red-soft);color:var(--red);}
.pill.met{background:var(--green-soft);color:var(--green);}
.pill.notarget{background:var(--gold-soft);color:var(--gold-ink);}
.pill.info{background:var(--surface-2);color:var(--ink-3);}
.pill.risk{background:var(--gold-soft);color:var(--gold-ink);}
.subpanels{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;margin-top:16px;}
.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);font-weight:600;}
.field input,.field textarea,.field select{border:1px solid var(--line-2);border-radius:7px;padding:6px 9px;background:var(--surface);font-weight:400;font-size:14px;color:var(--ink);}
.field textarea{resize:vertical;min-height:64px;line-height:1.4;}
.field.full{grid-column:1/-1;}
.field small{font-weight:400;color:var(--ink-3);font-size:12px;}
.catset{width:100%;border-collapse:collapse;font-size:13px;}
.catset th{text-align:left;font-weight:600;color:var(--ink-3);font-size:12px;padding:4px 6px;border-bottom:1px solid var(--line);}
.catset td{padding:4px 6px;border-bottom:1px solid var(--line);}
.catset input{width:70px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:var(--surface);text-align:right;}
.method{font-size:13px;color:var(--ink-2);line-height:1.55;max-width:90ch;}
.method p+p{margin-top:8px;}
footer{margin-top:18px;font-size:12px;color:var(--ink-3);}

/* dialog */
dialog{border:1px solid var(--line-2);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(620px,calc(100vw - 32px));max-height:calc(100vh - 48px);}
dialog::backdrop{background:rgba(8,18,36,.45);}
.dlg{padding:20px 22px;display:flex;flex-direction:column;gap:12px;}
.dlg h3{font-size:18px;}
.dlg .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.mlist{max-height:180px;overflow:auto;border:1px solid var(--line-2);border-radius:7px;padding:6px 8px;display:flex;flex-direction:column;gap:3px;font-weight:400;}
.mlist label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink);}
.dlg-foot{display:flex;justify-content:space-between;gap:8px;margin-top:4px;flex-wrap:wrap;}
.dlg-foot div{display:flex;gap:8px;}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:14px;font-weight:550;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100vw - 32px);}
.toast.show{opacity:1;}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 10px;border-radius:7px;max-width:280px;line-height:1.4;opacity:0;transition:opacity .12s;}
.tip.show{opacity:1;}
.notice{font-size:13px;background:var(--gold-soft);color:var(--gold-ink);border-radius:9px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
.notice[hidden]{display:none;}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr));}
  .pathgrid,.row4{grid-template-columns:minmax(0,1fr);gap:12px;}
}
@media (max-width:980px){
  .row1,.row2{grid-template-columns:minmax(0,1fr);}
  .months{grid-template-columns:minmax(0,1fr);}
  .subpanels{grid-template-columns:minmax(0,1fr);}
}
@media (max-width:640px){
  .grow{grid-template-columns:minmax(0,1fr) auto;row-gap:4px;}
  .grow .gbar{grid-column:1/-1;grid-row:2;}
  .catrow{grid-template-columns:96px minmax(0,1fr) 64px;gap:8px;}
  .wrap{padding:0 12px 40px;}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
  .scoreline{grid-template-columns:minmax(0,1fr);gap:8px;}
  .findings{grid-template-columns:minmax(0,1fr);}
  .hero{padding:20px 18px;}
  .panel{padding:16px;}
  .catrow{grid-template-columns:96px minmax(0,1fr) 64px;gap:8px;}
  .grow{grid-template-columns:minmax(0,1fr) auto;}
  .grow .gbar{grid-column:1/-1;grid-row:2;}
  .settings{grid-template-columns:minmax(0,1fr);}
  .dlg .grid2{grid-template-columns:minmax(0,1fr);}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}

/* ---------- Mandiri Cakra (simulasi) ---------- */
.btn.cakra{border-color:var(--gold);color:var(--ink);background:linear-gradient(180deg,rgba(245,179,27,.16),rgba(245,179,27,.06));font-weight:650;}
.btn.cakra:hover{background:linear-gradient(180deg,rgba(245,179,27,.28),rgba(245,179,27,.12));}
.hero-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:nowrap;}
.hero-head > div{min-width:0;}
.hero-head .btn.cakra.on-hero{background:rgba(255,255,255,.10);border-color:rgba(245,179,27,.75);color:#fff;flex-shrink:0;}
.hero-head .btn.cakra.on-hero:hover{background:rgba(255,255,255,.18);}
.btn.cakra .spark{width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:7px;display:inline-block;vertical-align:middle;box-shadow:0 0 0 3px rgba(245,179,27,.25);}
#dlgCakra{width:min(860px,calc(100vw - 32px));}
.dlg.ck{gap:14px;}
.ck-head{display:flex;align-items:center;gap:12px;}
.ck-head h3{margin:0;}
.ck-head .btn{margin-left:auto;}
.ck-sub{margin:2px 0 0;font-size:12.5px;color:var(--ink-3);letter-spacing:.02em;}
.ck-logo{width:38px;height:38px;border-radius:10px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;box-shadow:inset 0 -2px 0 var(--gold);}
.ck-status{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;}
.ck-status i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:ckpulse 1s ease-in-out infinite;}
.ck-status.on i{background:var(--green);animation:none;}
@keyframes ckpulse{0%,100%{opacity:.25}50%{opacity:1}}
.ck-sum{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px;}
.ck-sum div{flex:1 1 150px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--surface-2);}
.ck-sum span{display:block;font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;}
.ck-sum b{font-size:17px;font-weight:750;}
.ck-wrap{max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;}
table.ck-t{width:100%;border-collapse:collapse;font-size:13px;}
table.ck-t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-size:12px;font-weight:650;color:var(--ink-2);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.ck-t td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
table.ck-t td.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
table.ck-t tr:last-child td{border-bottom:0;}
.stage{display:inline-block;font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap;}
.stage.s3{background:rgba(22,140,90,.12);border-color:rgba(22,140,90,.35);color:var(--green);}
.stage.s2{background:rgba(245,179,27,.16);border-color:rgba(245,179,27,.4);}
.ck-note{font-size:12px;color:var(--ink-3);margin:0;max-width:60%;}
@media (max-width:640px){.ck-note{max-width:100%;}.ck-wrap{max-height:52vh;}}

@media (max-width:760px){.hero-head{flex-wrap:wrap;}.hero-head .btn.cakra.on-hero{order:-1;}}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;padding:5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;position:sticky;top:0;z-index:20;box-shadow:var(--shadow-1);}
.tabs button{border:0;background:transparent;color:var(--ink-2);font-weight:650;font-size:13.5px;padding:9px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;}
.tabs button:hover{background:var(--surface-2);color:var(--ink);}
.tabs button[aria-selected="true"]{background:var(--navy);color:#fff;}
.tabs button small{display:block;font-weight:500;font-size:11px;opacity:.75;margin-top:1px;}
@media (max-width:640px){.tabs{overflow-x:auto;flex-wrap:nowrap;position:static;}.tabs button{padding:8px 11px;font-size:13px;}.tabs button small{display:none;}}

/* ---------- analysis + ideas ---------- */
.ana{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px;}
.anacard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface-2);}
.anahead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px;}
.anahead b{font-size:15px;}
.anaflow{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin-bottom:10px;flex-wrap:wrap;}
.anaflow .now,.anaflow .then{font-weight:750;font-size:17px;color:var(--ink);}
.anaflow .then{color:var(--green);}
.anaflow .arrow{color:var(--gold);font-weight:800;}
.anabar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;flex:1 1 120px;min-width:90px;}
.anabar i{display:block;height:100%;background:var(--navy);}
.anabar i.proj{background:var(--gold);}
.issue{margin-top:10px;}
.issue .it{display:inline-block;font-size:12.5px;font-weight:700;color:#8a1c33;background:rgba(198,40,71,.12);border:1px solid rgba(198,40,71,.28);border-radius:8px;padding:4px 10px;}
.issue ul{margin:8px 0 0;padding-left:18px;}
.issue li{font-size:13px;color:var(--ink-2);margin-bottom:4px;}
.ideas{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;}
.ideacard{border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
.ideacard h3{font-size:14.5px;margin:0 0 10px;}
.ideagrp{margin-bottom:10px;}
.ideagrp b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin-bottom:4px;}
.ideagrp ul{margin:0;padding-left:18px;}
.ideagrp li{font-size:13px;color:var(--ink-2);margin-bottom:3px;}

/* ---------- simulation ---------- */
.panel.sim{border-color:var(--gold);}
.simhead{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.simhead div{flex:1 1 170px;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--surface-2);}
.simhead span{display:block;font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;}
.simhead b{font-size:22px;font-weight:750;}
.simhead div.accent{border-color:var(--gold);background:linear-gradient(180deg,rgba(245,179,27,.14),transparent);}
.simhead em{font-style:normal;font-size:12.5px;color:var(--ink-3);}
input.siminput{background:rgba(245,179,27,.14);border-color:rgba(245,179,27,.5);}
td.simcell{background:rgba(245,179,27,.06);}
th.simcol{background:rgba(245,179,27,.12);}

.mtheme{font-size:12.5px;font-weight:650;color:var(--navy);background:rgba(0,61,121,.07);border-radius:8px;padding:7px 10px;margin:0 0 10px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.mtheme span{font-weight:600;color:var(--ink-3);}
#pane-data .tablewrap{max-height:62vh;}
@media (max-width:640px){#pane-data .tablewrap{max-height:70vh;}}

.simhead em{display:block;margin-top:2px;}
.simhead b{display:block;}

.panel.sim .tablewrap table.ptable{min-width:520px;}
#pane-data .panel.sim .tablewrap{max-height:none;}

.simwrap{display:inline-flex;align-items:center;gap:5px;justify-content:flex-end;}
.simstep{display:inline-flex;gap:3px;}
.simstep button{width:22px;height:24px;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;color:var(--ink-2);font-weight:700;line-height:1;cursor:pointer;padding:0;}
.simstep button:hover{background:rgba(245,179,27,.2);border-color:var(--gold);color:var(--ink);}
.simbar{margin:0 0 16px;}
.simruler{position:relative;height:12px;border-radius:99px;background:var(--line);overflow:hidden;}
.simruler .fill{position:absolute;left:0;top:0;bottom:0;background:var(--navy);border-radius:99px;}
.simruler .fill.sim{background:var(--gold);opacity:.85;}
.simruler .mk{position:absolute;top:-3px;width:2px;height:18px;background:var(--navy);}
.simruler .mk.sim{background:#8a5b00;}
.simlabels{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:6px;}
.simlabels .s{font-weight:700;color:var(--ink);}

.datafilter{font-size:12.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:8px;}
.toggle.inline{font-size:12.5px;margin:0;}

/* ---------- RaportMu mikro ---------- */
.kpis.mk{margin-top:14px;margin-bottom:0;}
.mkbars{display:flex;flex-direction:column;gap:7px;}
.mkrow{display:grid;grid-template-columns:minmax(0,176px) minmax(0,1fr) 92px;align-items:center;gap:10px;border:1px solid transparent;border-radius:9px;padding:5px 7px;background:transparent;width:100%;text-align:left;cursor:pointer;}
.mkrow:hover{background:var(--surface-2);}
.mkrow[aria-pressed="true"]{border-color:var(--navy);background:var(--surface-2);}
.mkrow .nm{font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mkrow .nm span{display:block;font-weight:500;font-size:11.5px;color:var(--ink-3);}
.mkrow .stack{display:flex;height:16px;border-radius:5px;overflow:hidden;background:var(--line);}
.mkrow .stack i{display:block;height:100%;}
.mkrow .val{text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;}
.mkrow .val span{display:block;font-size:11px;font-weight:500;color:var(--ink-3);}
.legend .kol{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:5px;}
table.mig td,table.mig th{text-align:center;font-size:12.5px;padding:6px 7px;}
table.mig td.d{outline:1px solid var(--line-2);}
table.mig td.up{color:#0f7a4d;font-weight:700;}
table.mig td.down{color:#b0243f;font-weight:700;}
table.mig th:first-child,table.mig td:first-child{text-align:left;font-weight:650;}
.migsum{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;}
.migsum div{flex:1 1 120px;border:1px solid var(--line);border-radius:9px;padding:8px 11px;background:var(--surface-2);}
.migsum span{display:block;font-size:11.5px;color:var(--ink-3);}
.migsum b{font-size:15px;}
.mkcol{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.mkcol div{flex:1 1 130px;border:1px solid var(--line);border-radius:9px;padding:9px 12px;}
.mkcol span{display:block;font-size:11.5px;color:var(--ink-3);}
.mkcol b{font-size:16px;}
.mkcol div.warn{border-color:rgba(198,40,71,.4);background:rgba(198,40,71,.06);}
#mkJt svg{width:100%;height:auto;display:block;}
#mkJt rect.bar:hover{opacity:.78;}
@media (max-width:640px){.mkrow{grid-template-columns:minmax(0,110px) minmax(0,1fr) 74px;gap:7px;}}

table.mig{font-size:12px;min-width:520px;}
table.mig td,table.mig th{padding:5px 6px;}

.row2.tight{gap:18px;margin-bottom:8px;}
#pane-mikro .sectitle{margin:14px 0 8px;}

.scope{display:inline-block;vertical-align:middle;margin-left:8px;font-size:11px;font-weight:650;letter-spacing:.01em;padding:3px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-3);white-space:nowrap;}
.scope.cluster{border-color:rgba(62,155,233,.5);color:#2a6ea8;background:rgba(62,155,233,.1);}
.scope.branch{border-color:rgba(245,179,27,.55);color:#8a5b00;background:rgba(245,179,27,.13);}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .scope.cluster{color:#8cc4f0;} :root:not([data-theme="light"]) .scope.branch{color:#f0c65f;}}
:root[data-theme="dark"] .scope.cluster{color:#8cc4f0;}
:root[data-theme="dark"] .scope.branch{color:#f0c65f;}
@media (max-width:640px){.scope{display:block;margin:6px 0 0;}}

.rcfilters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.rcfilters .seg{margin:0;}
.rcsearch{margin-bottom:12px;max-width:420px;}
table.rc{font-size:12.5px;min-width:1000px;}
table.rc th{white-space:nowrap;}
table.rc th button{border:0;background:transparent;font:inherit;font-weight:650;color:inherit;cursor:pointer;padding:0;}
table.rc td{white-space:nowrap;}
table.rc td.l{text-align:left;}
table.rc td.name{font-weight:600;}
table.rc tr:hover td{background:var(--surface-2);}
.kolpill{display:inline-block;min-width:26px;text-align:center;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid var(--line-2);}
.kolpill.k1{background:rgba(0,61,121,.1);border-color:rgba(0,61,121,.3);}
.kolpill.k2{background:rgba(245,179,27,.18);border-color:rgba(245,179,27,.45);}
.kolpill.k3{background:rgba(198,40,71,.13);border-color:rgba(198,40,71,.4);color:var(--red);}
</style>

<body>
<template id="shell"><div class="wrap">
  <header class="topbar">
    <div class="brandline"><b id="orgName">Bank Mandiri</b><span>Dasbor kinerja cabang</span></div>

      <span class="savestate" id="saveState" role="status" aria-live="polite"><i></i><span>Semua perubahan tersimpan</span></span>

      <button class="btn primary" id="btnSave" type="button" disabled>Simpan perubahan</button>
    </div>
  </header>
  <div class="notice" id="draftNotice" hidden></div>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Bagian dasbor"></nav>

  <div class="pane" id="pane-ringkasan" role="tabpanel">

  <section class="row1" aria-label="Skor cabang dan filter">

      <div class="hero-head">
        <div>
          <h1 id="branchName">KCP Jakarta Muara Karang</h1>
          <p class="sub" id="branchSub"></p>
        </div>
        <button class="btn small cakra on-hero" id="btnCakra" type="button"><i class="spark" aria-hidden="true"></i>Pipeline KOPRA · Mandiri Cakra</button>
      </div>
      <div class="scoreline">
        <div>
          <div class="bignum"><span class="n" id="heroScore">78</span><span class="of" id="heroOf">/100</span></div>
          <p class="bignum-cap" id="heroCap">Skor cabang saat ini</p>
        </div>
        <div class="ruler" id="ruler" aria-hidden="true"></div>
      </div>
      <p class="summary" id="heroSummary"></p>
      <div class="findings" id="findings"></div>
    </div>

    <aside class="panel filters" aria-label="Filter">
      <div class="panel-h" style="margin-bottom:0">
        <div><h2>Filter</h2><p class="hint">Semua grafik, tabel, dan rencana di bawah mengikuti filter ini.</p></div>
        <button class="btn small" id="btnClear" type="button">Hapus filter</button>
      </div>
      <div class="fgroup"><span class="flabel" id="lblCat">Kategori</span><div class="chips" id="fCats" role="group" aria-labelledby="lblCat"></div></div>
      <div class="fgroup"><span class="flabel" id="lblStatus">Status target</span><div class="seg" id="fStatus" role="group" aria-labelledby="lblStatus"></div></div>
      <div class="fgroup"><span class="flabel" id="lblMonth">Bulan rencana</span><div class="seg" id="fMonth" role="group" aria-labelledby="lblMonth"></div></div>

    <div class="method" style="margin-top:20px">
      <h2 style="margin-bottom:8px">Cara skor dihitung</h2>
      <p>Poin per metrik = bobot × poin maksimum kategori × pencapaian. Pencapaian dibulatkan ke dua desimal dan dibatasi 100%; tidak ada pembulatan ke poin bulat. Metrik yang makin rendah makin baik (NPL, Kol 2) memakai rumus 2 − realisasi ÷ target, jadi realisasi dua kali target bernilai nol. Kalau targetnya 0%, hanya saldo nol yang dapat poin.</p>
      <p>Dengan aturan ini setiap baris dan setiap kategori persis sama dengan file: DANA 22,65, KREDIT 11,38, LIVIN 12,09, KOPRA 9,98, ACQUIRING 15,84, GMM 4,75, total 76,69. Penyesuaian skor sekarang 0 — selisih 3 poin di file sebelumnya ternyata berasal dari pembulatan per baris, bukan koreksi.</p>
      <p>Dua sumber dipakai di dasbor ini. File Mandiri Melesat hanya berisi data KCP Jakarta Muara Karang Dalam: kartu skor, portofolio cabang, komposisi segmen, dan buku kredit per kolektibilitas. File RaportMu berisi cluster mikro sembilan unit, termasuk unit Muara Karang Dalam, dan hanya dipakai di tab Unit mikro. Angka portofolio cabang, komposisi segmen, dan baris bertanda "file sebelumnya" berada di luar kartu skor. Proyeksi mengasumsikan target tetap selama periode rencana; metrik month-to-date (MtD) memakai angka bulan yang bersangkutan. Singkatan nominal: jt = juta, M = miliar, T = triliun.</p>

function selCats() { return S.categories.filter(function (c) { return !ui.cats.size || ui.cats.has(c.id); }); }

  var cs = selCats();

    vals: [0, 1, 2, 3].map(function (i) { return r2(cs.reduce(function (s, c) { return s + D.cats[c.id].score[i]; }, 0)); }),
    max: r2(cs.reduce(function (s, c) { return s + c.N; }, 0)),

/* ---------- formatting ---------- */
function listJoin(a) { if (a.length <= 1) return a.join(''); if (a.length === 2) return a[0] + ' dan ' + a[1]; return a.slice(0, -1).join(', ') + ', dan ' + a[a.length - 1]; }
function dec(s) { return String(s).replace('.', ','); }
function fx(x, d) { return Number(x.toFixed(d)).toLocaleString('id-ID', { maximumFractionDigits: d, minimumFractionDigits: 0 }); }
function fmtIdr(v) {
  var a = Math.abs(v);
  if (a >= 1e12) return 'Rp' + fx(v / 1e12, 2) + ' T';
  if (a >= 1e9) return 'Rp' + fx(v / 1e9, a / 1e9 < 100 ? 1 : 0) + ' M';
  if (a >= 1e6) return 'Rp' + fx(v / 1e6, a / 1e6 < 100 ? 1 : 0) + ' jt';
  return 'Rp' + fx(v, 0);
}
function fmtVal(m, v) {
  if (!isNum(v)) return '\u2014';
  if (m.unit === 'idr') return fmtIdr(v);
  if (m.unit === 'pct') return dec((v * 100).toFixed(2)) + '%';
  return fx(v, v % 1 ? 1 : 0);
}
function fmtAch(a) { return a == null ? '\u2014' : dec((a * 100).toFixed(1).replace(/\.0$/, '')) + '%'; }
function fmtPts(p) { return dec(String(Number((Math.round(p * 100) / 100).toFixed(2)))); }
function signed(n) { return (n > 0.0049 ? '+' : n < -0.0049 ? '\u2212' : '\u00b1') + fmtPts(Math.abs(n)); }
function ceilNice(r) {
  var a = Math.abs(r), s = a >= 1e12 ? 1e10 : a >= 1e11 ? 1e9 : a >= 1e9 ? 1e8 : a >= 1e6 ? 1e5 : 1;
  return Math.ceil(r / s - 1e-9) * s;
}
function fmtThreshold(m, r, keep) {
  if (r == null) return 'perlu target';
  if (m.dir === 'low') { if (r <= 0) return '= 0'; return '\u2264 ' + dec((Math.floor(r * 10000 + 1e-9) / 100).toFixed(2)) + '%'; }
  if (m.unit === 'count') return '\u2265 ' + fx(Math.ceil(r - 1e-9), 0);
  if (m.unit === 'pct') return '\u2265 ' + dec((Math.ceil(r * 10000 - 1e-9) / 100).toFixed(2)) + '%';
  return '\u2265 ' + fmtIdr(ceilNice(r));
}
function monthLabel(mo) { return mo === 0 ? 'Kini' : (S.meta.months[mo - 1] || ('Bulan ' + mo)); }
function metricLabel(m) { return (m.group ? m.group + ': ' : '') + m.name; }

/* ---------- filters ---------- */
function metricMatches(d, forTable) {
  var m = d.m;
  if (ui.cats.size && !ui.cats.has(m.cat)) return false;
  if (forTable && ui.scoredOnly && d.status === 'info') return false;
  if (ui.status !== 'all' && d.status !== ui.status) return false;
  if (ui.q) { var hay = (m.name + ' ' + (m.group || '') + ' ' + d.c.name).toLowerCase(); if (hay.indexOf(ui.q) < 0) return false; }
  return true;
}
function actionCats(a) {
  var ids = a.metrics && a.metrics.length ? a.metrics : ((faById(a.fa) || {}).metrics || []);
  return ids.map(function (id) { var m = mById(id); return m ? m.cat : null; }).filter(Boolean);
}
function actionMatches(a, ignoreMonth) {
  if (!ignoreMonth && ui.month && a.month !== ui.month) return false;
  if (ui.fa && a.fa !== ui.fa) return false;
  if (ui.metric && (a.metrics || []).indexOf(ui.metric) < 0) return false;
  if (ui.cats.size && !actionCats(a).some(function (c) { return ui.cats.has(c); })) return false;
  if (ui.q) {
    var names = (a.metrics || []).map(function (id) { var m = mById(id); return m ? m.name + ' ' + (m.group || '') : ''; }).join(' ');
    var hay = (a.title + ' ' + a.detail + ' ' + a.owner + ' ' + names + ' ' + ((faById(a.fa) || {}).name || '')).toLowerCase();

}

/* ---------- render: gaps ---------- */
function renderGaps(D) {
  var all = Object.keys(D.md).map(function (k) { return D.md[k]; });
  var win = all.filter(function (d) { return d.sc && (d.status === 'below' || d.status === 'notarget') && d.gain > 0 && metricMatches(d, false); });
  win.sort(function (a, b) { return (b.gain - a.gain) || ((a.a || 0) - (b.a || 0)); });
  var capped = win.filter(function (d) { return d.capped; });
  win = win.filter(function (d) { return !d.capped; });
  var protect = all.filter(function (d) { return d.risk && metricMatches(d, false); });
  var maxG = Math.max.apply(null, win.map(function (d) { return d.gain; }).concat(protect.map(function (d) { return d.pts[0]; })).concat([1]));
  function row(d, kind) {
    var m = d.m, pressed = ui.metric === m.id;
    var sub = esc(d.c.name + (m.group ? ', ' + m.group : '') + ', bobot ' + dec(m.w));

      right = fmtAch(d.a) + '<span>jaga ' + esc(fmtThreshold(m, d.risk.real)) + '</span>';
      tip = metricLabel(m) + ': ' + fmtVal(m, m.real) + ' vs target ' + fmtVal(m, m.target) + '. Poin mulai berkurang kalau lewat ' + fmtThreshold(m, d.risk.real) + '.';
    } else {

      right = (d.status === 'notarget' ? 'Tanpa target' : fmtAch(d.a)) + '<span>' + (d.capped ? 'hanya buffer' : d.status === 'notarget' ? 'tetapkan target' : d.next ? 'penuh di ' + esc(fmtThreshold(m, d.next.real)) : '') + '</span>';
      tip = metricLabel(m) + ': ' + fmtVal(m, m.real) + ' vs target ' + fmtVal(m, m.target) + ' (' + fmtAch(d.a) + '). ' + fmtPts(d.pts[0]) + ' dari ' + fmtPts(d.p100) + ' poin.' + (d.capped ? ' Kategori ini sudah maksimal, jadi gap ini belum mengurangi skor, tetapi menghilangkan buffer.' : '');
    }
    return '<button type="button" class="grow" data-metric="' + m.id + '" aria-pressed="' + pressed + '" data-tip="' + esc(tip) + '"><span class="gname"><b>' + esc(metricLabel(m)) + '</b><span>' + sub + '</span></span><span class="gbar">' + bar + '</span><span class="gach">' + right + '</span></button>';
  }
  var LIM = 6, shown = ui.gapsAll ? win : win.slice(0, LIM), hidden = win.length - shown.length + (ui.gapsAll ? 0 : capped.length);

  html += shown.length ? shown.map(function (d) { return row(d, 'win'); }).join('') : '<p class="empty">Tidak ada metrik dinilai di bawah 100% yang sesuai filter.</p>';
  protect = protect.slice(0, 6);
  if (protect.length) html += '<p class="gsub more">Poin dengan margin di bawah 10 poin persentase</p>' + protect.map(function (d) { return row(d, 'risk'); }).join('');
  if (ui.gapsAll && capped.length) html += '<p class="gsub more">Di bawah 100% pada kategori yang sudah maksimal</p>' + capped.map(function (d) { return row(d, 'win'); }).join('');
  if (hidden > 0 || ui.gapsAll) html += '<button type="button" class="btn small gmore" id="gapsMore">' + (ui.gapsAll ? 'Tampilkan ' + LIM + ' teratas saja' : 'Tampilkan semua ' + (win.length + capped.length) + ' metrik yang mempertaruhkan poin') + '</button>';
  $('#gaps').innerHTML = html;

function simVal(m) { var s = S.sim || {}; return isNum(s[m.id]) ? s[m.id] : m.real; }

    var arr = S.plan[m.id] ? S.plan[m.id].slice() : [null, null, null];
    arr[+p[2]] = v;
    if (arr.every(function (x) { return !isNum(x); })) delete S.plan[m.id]; else S.plan[m.id] = arr;
  }
  commit();
}

/* ---------- action dialog ---------- */
var editingId = null;
function F(n) { return $('#actionForm').elements.namedItem(n); }
function openAction(id, month) {
  var a = id ? S.actions.filter(function (x) { return x.id === id; })[0] : null;
  editingId = a ? a.id : null;
  var f = $('#actionForm');
  $('#dlgTitle').textContent = a ? 'Ubah aksi' : 'Tambah aksi';
  $('#dlgApply').textContent = a ? 'Terapkan' : 'Tambah aksi';
  $('#dlgDelete').hidden = !a;
  F('title').value = a ? a.title : '';
  F('detail').value = a ? a.detail : '';
  F('owner').value = a ? a.owner : '';
  F('status').value = a ? a.status : 'todo';
  F('fa').innerHTML = S.focusAreas.map(function (x) { return '<option value="' + x.id + '">' + esc(x.name) + '</option>'; }).join('');
  F('fa').value = a ? a.fa : (ui.fa || S.focusAreas[0].id);
  F('month').innerHTML = [1, 2, 3].map(function (i) { return '<option value="' + i + '">' + esc(monthLabel(i)) + '</option>'; }).join('');
  F('month').value = String(a ? a.month : (month || 1));
  var linked = a ? (a.metrics || []) : ((faById(F('fa').value) || {}).metrics || []);
  var D = compute();
  var list = S.metrics.filter(function (m) { return scored(m) || linked.indexOf(m.id) >= 0; });
  $('#dlgMetrics').innerHTML = list.map(function (m) {
    var d = D.md[m.id];
    return '<label><input type="checkbox" value="' + m.id + '"' + (linked.indexOf(m.id) >= 0 ? ' checked' : '') + '> ' + esc(cat(m.cat).name + ': ' + metricLabel(m)) + ' <span style="color:var(--ink-3)">(' + fmtAch(d.a) + ')</span></label>';
  }).join('');
  var dlg = $('#dlgAction');
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  setTimeout(function () { F('title').focus(); }, 30);
}
function closeDlg(d) { if (d.close) d.close(); else d.removeAttribute('open'); }

/* ---------- Mandiri Cakra: pipeline KOPRA (simulasi) ---------- */
var ckSynced = null;
function ckStage(t) { return t === 'Aktivasi' ? 's3' : t === 'Dokumen' || t === 'Pitching' ? 's2' : ''; }
function ckRows() { return (S.cakra && S.cakra.rows) || []; }
function ckTop(n) {
  return ckRows().slice().sort(function (a, b) { return (b.giro || 0) - (a.giro || 0); }).slice(0, n);
}
function renderCakraBody() {
  var rows = ckRows();
  var giro = rows.reduce(function (s, r) { return s + (r.giro || 0); }, 0);
  var pot = rows.reduce(function (s, r) { return s + (r.potensi || 0); }, 0);
  var D = compute(), d = D.md['dpk-endbal-giro'];
  var gap = d && isNum(d.m.target) && isNum(d.m.real) ? Math.max(0, d.m.target - d.m.real) : 0;
  var cover = gap ? Math.round(giro / gap * 100) : null;
  var sum = '<div class="ck-sum">' +
    '<div><span>Prospek</span><b>' + rows.length + '</b></div>' +
    '<div><span>Potensi dana kelolaan</span><b>' + esc(fmtIdr(pot)) + '</b></div>' +
    '<div><span>Potensi saldo giro</span><b>' + esc(fmtIdr(giro)) + '</b></div>' +
    (cover != null ? '<div><span>Menutup gap Endbal Giro</span><b>' + dec(String(cover)) + '%</b></div>' : '') + '</div>';
  var head = '<thead><tr><th>Nasabah</th><th>Segmen</th><th>Produk</th><th>Tahap</th><th class="r">Potensi dana</th><th class="r">Potensi giro</th><th>PIC</th><th>Target</th></tr></thead>';
  var body = rows.map(function (r) {
    return '<tr><td><b>' + esc(r.nama) + '</b></td><td>' + esc(r.segmen || '') + '</td><td>' + esc(r.produk || '') + '</td>' +
      '<td><span class="stage ' + ckStage(r.tahap) + '">' + esc(r.tahap || '') + '</span></td>' +
      '<td class="r">' + esc(fmtIdr(r.potensi || 0)) + '</td><td class="r">' + esc(fmtIdr(r.giro || 0)) + '</td>' +
      '<td>' + esc(r.pic || '') + '</td><td>' + esc(r.target || '') + '</td></tr>';
  }).join('');
  $('#ckBody').innerHTML = sum + '<div class="ck-wrap"><table class="ck-t">' + head + '<tbody>' + body + '</tbody></table></div>';
  $('#ckNote').textContent = (S.cakra && S.cakra.note) || '';
  $('#ckToPlan').hidden = false;
}
function openCakra() {
  var dlg = $('#dlgCakra'), st = $('#ckStatus');
  $('#ckSub').textContent = (S.cakra && S.cakra.app) || 'Mandiri Cakra';
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  if (ckSynced) {
    st.className = 'ck-status on';
    st.innerHTML = '<i></i><span>Terhubung \u00b7 sinkron terakhir ' + esc(ckSynced) + '</span>';
    return renderCakraBody();
  }
  $('#ckBody').innerHTML = ''; $('#ckToPlan').hidden = true; $('#ckNote').textContent = '';
  st.className = 'ck-status';
  var steps = ['Menghubungkan ke Mandiri Cakra\u2026', 'Memverifikasi akses cabang 16805\u2026', 'Menarik pipeline KOPRA\u2026'], i = 0;
  st.innerHTML = '<i></i><span>' + steps[0] + '</span>';
  var tick = setInterval(function () {
    i++;
    if (i < steps.length) { st.querySelector('span').textContent = steps[i]; return; }
    clearInterval(tick);
    ckSynced = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    st.className = 'ck-status on';
    st.innerHTML = '<i></i><span>Terhubung \u00b7 sinkron terakhir ' + esc(ckSynced) + '</span>';
    renderCakraBody();
  }, 520);
}
function cakraToPlan() {
  var top = ckTop(3);
  if (!top.length) return;
  var giro = top.reduce(function (s, r) { return s + (r.giro || 0); }, 0);
  S.actions.push({
    id: 'a' + Date.now().toString(36), month: 1, fa: 'giro',
    title: 'Kejar 3 prospek KOPRA teratas dari pipeline Cakra',
    detail: top.map(function (r) { return r.nama + ' (' + r.tahap.toLowerCase() + ')'; }).join(', ') +
      '. Total potensi saldo giro ' + fmtIdr(giro) + '. Kunci tanggal aktivasi dan rekening settlement di cabang.',
    owner: 'Relationship Manager', status: 'todo',
    metrics: ['dpk-endbal-giro', 'dpk-avgbal-giro-mtd', 'kopra-gtv']
  });
  closeDlg($('#dlgCakra'));
  toast('Aksi dibuat dari pipeline Cakra');
  commit();
}

/* ---------- export ---------- */
function csvCell(v) { v = v == null ? '' : String(v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function toCsv(rows) { return '\ufeff' + rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n'); }
function slugName() { return S.meta.branch.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function download(filename, data) {
  if (!downloadsApi) return;
  downloadsApi.save({ filename: filename, data: data }).then(function () { toast('Terunduh: ' + filename); }).catch(function (e) {
    var c = e && e.code;
    if (c === 'declined') return;
    if (c === 'rate_limited') toast('Ada unduhan yang masih menunggu konfirmasi.');
    else if (c === 'unavailable' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') { downloadsApi = null; renderSaveBar(); toast('Unduhan tidak tersedia di tampilan ini.'); }
    else toast('Unduhan gagal. Coba lagi.');
  });
}
function exportMetrics() {
  var D = compute();
  var rows = [['Kategori', 'Grup', 'Metrik', 'Bobot', 'Realisasi', 'Target', 'Pencapaian %', 'Poin kini', 'Poin pada 100%', 'Poin penuh di', 'Status', 'Rencana ' + monthLabel(1), 'Rencana ' + monthLabel(2), 'Rencana ' + monthLabel(3)]];
  S.metrics.forEach(function (m) {
    var d = D.md[m.id], p = S.plan[m.id] || [];
    rows.push([d.c.name, m.group || '', m.name, m.w, isNum(m.real) ? m.real : '', isNum(m.target) ? m.target : '', d.a == null ? '' : (d.a * 100).toFixed(2), d.sc ? d.pts[0] : '', d.sc ? d.p100 : '', d.next ? fmtThreshold(m, d.next.real) : '', STATUS_LABEL[d.status], isNum(p[0]) ? p[0] : '', isNum(p[1]) ? p[1] : '', isNum(p[2]) ? p[2] : '']);
  });
  download(slugName() + '-metrik.csv', toCsv(rows));
}
function exportPlan() {
  var rows = [['Bulan', 'Area fokus', 'Aksi', 'Rincian', 'PIC', 'Status', 'Metrik terkait']];
  S.actions.slice().sort(function (a, b) { return a.month - b.month; }).forEach(function (a) {
    rows.push([monthLabel(a.month), (faById(a.fa) || {}).name || '', a.title, a.detail, a.owner, ACT_STATUS[a.status], (a.metrics || []).map(function (id) { var m = mById(id); return m ? cat(m.cat).name + ' ' + metricLabel(m) : ''; }).join('; ')]);
  });
  download(slugName() + '-rencana-aksi.csv', toCsv(rows));
}

/* ---------- publish ---------- */
function buildDocument(state) {
  var css = $('#app-css').textContent, js = $('#app-js').textContent, shell = $('#shell').innerHTML;
  var J = function (o) { return JSON.stringify(o).replace(/</g, '\\u003c'); };
  var sc = 'script';
  return '<!doctype html>\n<html lang="id">\n<head>\n' + HEAD_HTML + '\n<style id="app-css">' + css + '</style>\n</head>\n<body>\n<template id="shell">' + shell + '</template>\n<div id="app"></div>\n' +
    '<' + sc + ' type="application/json" id="app-original">' + J(ORIGINAL) + '</' + sc + '>\n' +
    '<' + sc + ' type="application/json" id="app-state">' + J(state) + '</' + sc + '>\n' +
    '<' + sc + ' id="app-js">' + js + '</' + sc + '>\n</body>\n</html>\n';
}
function save(retried) {
  if (!artifactApi || readOnly || !dirty || saving) return;
  var next = clone(S); next.rev = (SAVED.rev || 1) + 1; next.savedAt = new Date().toISOString();
  saving = true; renderSaveBar(); writeDraft();
  artifactApi.publish(buildDocument(next)).then(function () {
    saving = false; clearDraft(); if (standalone) { SAVED = clone(next); S.rev = next.rev; S.savedAt = next.savedAt; } dirty = false; toast(standalone ? 'HTML terbaru terunduh. Buka file itu di lain waktu.' : 'Perubahan tersimpan'); renderSaveBar();
  }).catch(function (e) {
    saving = false;
    var c = e && e.code;
    if (c === 'conflict') toast('Ada versi yang lebih baru. Memuat versi itu; perubahan Anda tetap di browser ini.');
    else if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].indexOf(c) >= 0) { readOnly = true; toast('Tampilan ini hanya bisa dilihat. Perubahan Anda tetap di browser ini.'); }
    else if (c === 'rate_limited') toast('Terlalu sering menyimpan. Tunggu sebentar, lalu simpan lagi.');
    else if (c === 'too_large') toast('Dasbor terlalu besar untuk disimpan. Hapus beberapa aksi lalu coba lagi.');
    else if (!retried) { setTimeout(function () { save(true); }, 800 + Math.random() * 800); return; }
    else toast('Perubahan belum tersimpan. Coba lagi sebentar lagi.');
    renderSaveBar();
  });
}

/* ---------- draft restore ---------- */
function validState(x) { return x && Array.isArray(x.metrics) && Array.isArray(x.categories) && Array.isArray(x.actions) && x.meta && x.plan; }
(function () {
  var d = readDraft(); if (!d || !validState(d.state)) return;
  if (JSON.stringify(d.state) === JSON.stringify(SAVED)) { clearDraft(); return; }
  var n = $('#draftNotice');
  if (d.rev === SAVED.rev) {
    S = d.state; dirty = true;
    n.innerHTML = '<span>Perubahan yang belum disimpan dari kunjungan terakhir sudah dipulihkan.</span><button class="btn small" type="button" data-draft="discard">Buang</button>';
  } else {
    n.innerHTML = '<span>Ditemukan perubahan belum disimpan dari versi sebelumnya di browser ini.</span><button class="btn small" type="button" data-draft="restore">Pulihkan</button><button class="btn small ghost" type="button" data-draft="discard">Buang</button>';
    n._draft = d.state;
  }
  n.hidden = false;
})();

/* ---------- events ---------- */
doc.addEventListener('click', function (e) {
  var t = e.target.closest('button, [data-cat]'); if (!t) return;
  if (t.hasAttribute('data-cat')) { var id = t.getAttribute('data-cat'); if (!id) ui.cats.clear(); else if (ui.cats.has(id)) ui.cats.delete(id); else ui.cats.add(id); return renderAll(); }
  if (t.hasAttribute('data-status')) { ui.status = t.getAttribute('data-status'); return renderAll(); }
  if (t.hasAttribute('data-month') && !t.hasAttribute('data-act')) { ui.month = +t.getAttribute('data-month'); return renderAll(); }
  if (t.hasAttribute('data-fa')) { ui.fa = t.getAttribute('data-fa') || null; return renderAll(); }
  if (t.hasAttribute('data-metric')) { var mid = t.getAttribute('data-metric'); ui.metric = ui.metric === mid ? null : mid; return renderAll(); }
  if (t.id === 'gapsMore') { ui.gapsAll = !ui.gapsAll; return renderAll(); }
  if (t.hasAttribute('data-rcset')) { ui.rc.set = t.getAttribute('data-rcset'); ui.rc.limit = 100; ui.rc.filters = {}; ui.rc.sort = 'bade'; ui.rc.dir = -1; return renderRincian(); }
  if (t.hasAttribute('data-rcfilter')) {
    var rf = t.getAttribute('data-rcfilter').split(':');
    ui.rc.filters[rf[0]] = rf[1] || '';
    ui.rc.limit = 100; return renderRincian();
  }
  if (t.hasAttribute('data-rcsort')) {
    var rs = t.getAttribute('data-rcsort');
    if (ui.rc.sort === rs) ui.rc.dir = -ui.rc.dir; else { ui.rc.sort = rs; ui.rc.dir = -1; }
    return renderRincian();
  }
  if (t.id === 'rcMore') { ui.rc.limit = (ui.rc.limit || 100) + 100; return renderRincian(); }
  if (t.id === 'rcExport') return rcExport();
  if (t.hasAttribute('data-cwdate')) { ui.cw.date = t.getAttribute('data-cwdate'); renderCreditKol(); return renderMikroBranch(compute()); }
  if (t.hasAttribute('data-segmode')) { ui.segMode = t.getAttribute('data-segmode'); return renderSegments(); }
  if (t.hasAttribute('data-mkunit')) { ui.mk.unit = t.getAttribute('data-mkunit') || null; return renderMikro(); }
  if (t.hasAttribute('data-mkprod')) { ui.mk.produk = t.getAttribute('data-mkprod'); return renderMikro(); }
  if (t.hasAttribute('data-mkview')) { ui.mk.view = t.getAttribute('data-mkview'); return renderMikro(); }
  if (t.hasAttribute('data-mksort')) {
    var mks = t.getAttribute('data-mksort');
    if (ui.mk.sort === mks) ui.mk.dir = -ui.mk.dir; else { ui.mk.sort = mks; ui.mk.dir = mks === 'name' ? 1 : -1; }
    return renderMikro();
  }
  if (t.hasAttribute('data-sim')) {
    var sp = t.getAttribute('data-sim').split(':'), sm = mById(sp[0]);
    if (!sm) return;
    S.sim = S.sim || {};
    var cur = isNum(S.sim[sm.id]) ? S.sim[sm.id] : sm.real;
    if (!isNum(cur)) cur = 0;
    var base = Math.abs(cur) > 1e-9 ? Math.abs(cur) * 0.05 : (isNum(sm.target) && sm.target ? Math.abs(sm.target) * 0.05 : 1);
    var nv = cur + (sp[1] === 'up' ? base : -base);
    if (nv < 0) nv = 0;
    S.sim[sm.id] = sm.unit === 'count' ? Math.round(nv) : nv;
    return commit();
  }
  if (t.hasAttribute('data-tab')) return setTab(t.getAttribute('data-tab'));
  if (t.hasAttribute('data-port')) { ui.port = t.getAttribute('data-port'); return renderPortfolio(); }
  if (t.hasAttribute('data-seg')) { ui.seg = t.getAttribute('data-seg'); return renderSegments(); }
  if (t.hasAttribute('data-sort')) { ui.sort = t.getAttribute('data-sort'); return renderAll(); }
  if (t.hasAttribute('data-clear')) { ui[t.getAttribute('data-clear')] = null; return renderAll(); }
  if (t.hasAttribute('data-draft')) {
    var n = $('#draftNotice');
    if (t.getAttribute('data-draft') === 'restore' && n._draft) { S = n._draft; S.rev = SAVED.rev; S.savedAt = SAVED.savedAt; }
    else { S = clone(SAVED); clearDraft(); }
    n.hidden = true; return commit();
  }
  var act = t.getAttribute('data-act');
  if (act === 'edit') return openAction(t.getAttribute('data-id'));
  if (act === 'add') return openAction(null, +t.getAttribute('data-month'));
  switch (t.id) {
    case 'btnClear2':
    case 'btnClear': ui.cats.clear(); ui.status = 'all'; ui.month = 0; ui.q = ''; ui.metric = null; ui.fa = null; $('#fSearch').value = ''; return renderAll();
    case 'btnSave': return save(false);
    case 'btnDiscard': S = clone(SAVED); clearDraft(); $('#draftNotice').hidden = true; return commit();
    case 'btnCakra': return openCakra();
    case 'ckClose': return closeDlg($('#dlgCakra'));
    case 'ckToPlan': return cakraToPlan();
    case 'btnSimReset': S.sim = {}; toast('Simulasi dikosongkan'); return commit();
    case 'btnSimCopy':
      S.sim = {};
      S.metrics.forEach(function (m) { if (scored(m) && isNum(m.real)) S.sim[m.id] = m.real; });
      toast('Realisasi disalin ke kolom simulasi'); return commit();
    case 'btnExportData': return exportMetrics();
    case 'btnExportPlan': return exportPlan();
    case 'btnReset':
      $('#cfBody').textContent = 'Semua nilai metrik, nilai rencana, aksi, dan pengaturan akan diganti dengan data file asli. Anda masih bisa membatalkannya sebelum menyimpan.';
      var cf = $('#dlgConfirm'); if (cf.showModal) cf.showModal(); else cf.setAttribute('open', ''); return;
    case 'cfCancel': return closeDlg($('#dlgConfirm'));
    case 'cfOk': S = clone(ORIGINAL); S.rev = SAVED.rev; S.savedAt = SAVED.savedAt; closeDlg($('#dlgConfirm')); toast('Dikembalikan ke data file. Simpan untuk mempertahankannya.'); return commit();
    case 'dlgCancel': return closeDlg($('#dlgAction'));
    case 'dlgDelete':
      S.actions = S.actions.filter(function (a) { return a.id !== editingId; });
      closeDlg($('#dlgAction')); toast('Aksi dihapus'); return commit();
  }
});
doc.addEventListener('change', function (e) {
  var t = e.target;
  if (t.matches('select[data-act="status"]')) {
    var a = S.actions.filter(function (x) { return x.id === t.getAttribute('data-id'); })[0];
    if (a) { a.status = t.value; commit(); } return;
  }
  if (t.id === 'rcMask') { ui.rc.mask = t.checked; return renderRincian(); }
  if (t.id === 'fScored' || t.id === 'fScored2') { ui.scoredOnly = t.checked; var o = $(t.id === 'fScored' ? '#fScored2' : '#fScored'); if (o) o.checked = t.checked; return renderAll(); }
  if (t.name === 'fa' && t.form && t.form.id === 'actionForm' && !editingId) {
    var ids = (faById(t.value) || {}).metrics || [];
    $$('#dlgMetrics input').forEach(function (cb) { cb.checked = ids.indexOf(cb.value) >= 0; });
    return;
  }
  if (t.hasAttribute('data-key')) applyEdit(t);
});
$('#fSearch').addEventListener('input', function (e) { ui.q = e.target.value.trim().toLowerCase(); renderAll(); });
$('#rcSearch').addEventListener('input', function (e) { ui.rc.q = e.target.value.trim(); ui.rc.limit = 100; renderRincian(); });
$('#actionForm').addEventListener('submit', function (e) {
  e.preventDefault();
  var title = F('title').value.trim();
  if (!title) { F('title').focus(); toast('Beri judul singkat untuk aksi ini.'); return; }
  var data = { title: title, detail: F('detail').value.trim(), owner: F('owner').value.trim(), status: F('status').value, fa: F('fa').value, month: +F('month').value,
    metrics: $$('#dlgMetrics input:checked').map(function (cb) { return cb.value; }) };
  if (editingId) { S.actions.forEach(function (a) { if (a.id === editingId) Object.assign(a, data); }); }
  else { data.id = 'a' + Date.now().toString(36); S.actions.push(data); }
  closeDlg($('#dlgAction')); toast(editingId ? 'Aksi diperbarui' : 'Aksi ditambahkan'); commit();
});

/* tooltip */
var tip = $('#tip');
function showTip(el, x, y) {
  var txt = el.getAttribute('data-tip'); if (!txt) return;
  tip.textContent = txt; tip.classList.add('show');
  var r = tip.getBoundingClientRect();
  var left = clamp(x + 14, 8, window.innerWidth - r.width - 8), top = y + 16;
  if (top + r.height > window.innerHeight - 8) top = y - r.height - 12;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
doc.addEventListener('pointermove', function (e) {
  if (e.pointerType === 'touch') return;
  var el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showTip(el, e.clientX, e.clientY); else tip.classList.remove('show');
});
doc.addEventListener('focusin', function (e) {
  var el = e.target.closest && e.target.closest('[data-tip]');
  if (el) { var r = el.getBoundingClientRect(); showTip(el, r.left + 20, r.bottom - 8); } else tip.classList.remove('show');
});
doc.addEventListener('scroll', function () { tip.classList.remove('show'); }, true);

/* resize */
var lastW = 0;
if (window.ResizeObserver) new ResizeObserver(function () { var w = $('#pathChart').clientWidth; if (Math.abs(w - lastW) > 4) { lastW = w; renderPath(compute()); } }).observe($('#pathChart'));
else window.addEventListener('resize', function () { renderPath(compute()); });

/* capabilities */
if (window.claude && typeof window.claude.use === 'function') {
  window.claude.use('artifact').then(function (a) { artifactApi = a; capChecked = true; renderSaveBar(); }, function () { capChecked = true; renderSaveBar(); });
  window.claude.use('downloads').then(function (d) { downloadsApi = d; renderSaveBar(); }, function () {});
} else {
  // Opened as a standalone file: CSV exports and "save" become browser downloads.
  standalone = true;
  var fileDl = function (filename, data, type) {
    var url = URL.createObjectURL(new Blob([data], { type: type }));
    var a = doc.createElement('a'); a.href = url; a.download = filename; doc.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
  };
  downloadsApi = { save: function (r) { fileDl(r.filename, r.data, 'text/csv;charset=utf-8'); return Promise.resolve({ status: 'saved' }); } };
  artifactApi = { publish: function (html) { fileDl(slugName() + '-dasbor.html', html, 'text/html;charset=utf-8'); return Promise.resolve({}); } };
  $('#btnSave').textContent = 'Unduh HTML terbaru';
  capChecked = true;
}

renderAll();
})();
</script>
